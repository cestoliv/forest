name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos

    steps:
      - uses: actions/checkout@v6

      - name: Print Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Print Node version
        run: node --version

      - name: Test (pure extension logic)
        run: node --test

      # shexli mirrors the extensions.gnome.org review checks. It always exits 0,
      # so we gate on error-severity findings ourselves; warnings stay advisory.
      - name: Static analysis (shexli)
        run: |
          # Pin tree-sitter to the 0.25.x line: shexli requires tree-sitter>=0.25.0
          # (unpinned), but tree-sitter 0.26.0 changed the native ABI and there is no
          # matching tree-sitter-javascript 0.26 build yet, so the 0.26 core + 0.25
          # grammar pair segfaults. Drop the cap once a 0.26-compatible grammar ships.
          python3 -m pip install -q shexli "tree-sitter<0.26"
          # shexli needs an absolute path (it crashes on a relative one).
          EXT="$GITHUB_WORKSPACE/linux/gnome-extension/ide-toggler@cestoliv.com"
          shexli --format text "$EXT"
          shexli --format json "$EXT" > shexli-report.json
          errors=$(jq '.summary.severity_counts.error // 0' shexli-report.json)
          echo "shexli error-level findings: $errors"
          if [ "$errors" -gt 0 ]; then
            echo "::error::shexli reported $errors error-level finding(s) — see output above"
            exit 1
          fi
